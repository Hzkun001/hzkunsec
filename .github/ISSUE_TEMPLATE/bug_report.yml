name: Bug report
description: Report a defect in hzkunsec (do not post sensitive target evidence).
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: Avoid secrets, real targets and sensitive logs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
